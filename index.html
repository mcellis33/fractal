<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fractal Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d1117;
      --surface:    #161b22;
      --surface2:   #1c2128;
      --border:     #30363d;
      --text:       #c9d1d9;
      --muted:      #8b949e;
      --accent:     #58a6ff;
      --accent-hi:  #79b8ff;
      --success:    #3fb950;
      --r:          6px;
      --panel-w:    300px;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      height: 50px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 10px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    #status-line {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── Layout ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: var(--panel-w) 1fr;
      overflow: hidden;
    }

    /* ── Controls panel ── */
    #controls {
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 14px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Section groupings */
    .section {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section:last-child {
      border-bottom: none;
    }

    /* Labels */
    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    .sublabel {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
      display: block;
    }

    /* Inputs */
    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 6px 9px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 1; }

    select:focus,
    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
    }

    /* Two-column grid for paired inputs */
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field { display: flex; flex-direction: column; }

    /* Slider row */
    .slider-wrap { display: flex; flex-direction: column; gap: 6px; }

    .slider-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .badge {
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--accent);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      user-select: none;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent);
      transition: background 0.15s, transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: var(--accent-hi);
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
    }

    /* Inline max-iter: slider + number side by side */
    .iter-row {
      display: grid;
      grid-template-columns: 1fr 72px;
      gap: 10px;
      align-items: center;
    }

    /* Color picker */
    .color-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 38px;
      height: 30px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: var(--surface2);
      cursor: pointer;
      flex-shrink: 0;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

    #color-hex {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 8px 14px;
      border: none;
      border-radius: var(--r);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #0d1117;
    }

    .btn-primary:not(:disabled):hover { background: var(--accent-hi); }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:not(:disabled):hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-danger {
      background: transparent;
      color: #f85149;
      border: 1px solid #f8514966;
    }

    .btn-danger:hover { border-color: #f85149; }

    .btn-group { display: flex; flex-direction: column; gap: 7px; }

    /* ── Canvas area ── */
    #canvas-area {
      display: flex;
      flex-direction: column;
      background: #000;
      overflow: hidden;
    }

    #canvas-scroll {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    /* Scale the canvas down to fit while keeping the pixel data full-res.
       max-width/max-height on a canvas element affects only display size —
       the underlying pixel dimensions used by toBlob() remain unchanged. */
    #fractal-canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated; /* crisp pixels when scaled down */
    }

    #canvas-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      padding: 40px;
      text-align: center;
      user-select: none;
    }

    #canvas-placeholder svg {
      opacity: 0.2;
    }

    /* ── Progress bar ── */
    #progress-wrap {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    progress#progress-bar {
      flex: 1;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      border: none;
      border-radius: 3px;
      overflow: hidden;
      background: var(--surface2);
    }

    progress#progress-bar::-webkit-progress-bar   { background: var(--surface2); border-radius: 3px; }
    progress#progress-bar::-webkit-progress-value { background: var(--accent);   border-radius: 3px; transition: width 0.1s; }
    progress#progress-bar::-moz-progress-bar      { background: var(--accent);   border-radius: 3px; }

    #progress-label {
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--muted);
      min-width: 34px;
      text-align: right;
    }

    /* Utility */
    [hidden] { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>Fractal Generator</h1>
  <span id="status-line">Ready</span>
</header>

<main>

  <!-- ── Controls ── -->
  <aside id="controls">

    <!-- Fractal type -->
    <div class="section">
      <div>
        <span class="label">Fractal Type</span>
        <select id="fractal-select">
          <option value="mandelbrot">Mandelbrot Set</option>
          <option value="julia">Julia Set</option>
        </select>
      </div>
    </div>

    <!-- Julia-only parameters -->
    <div id="julia-section" class="section" hidden>
      <div>
        <span class="label">Julia Constant c</span>
        <div class="pair">
          <div class="field">
            <span class="sublabel">Re(c)</span>
            <input type="number" id="julia-re" value="-0.7" step="0.001" />
          </div>
          <div class="field">
            <span class="sublabel">Im(c)</span>
            <input type="number" id="julia-im" value="0.27" step="0.001" />
          </div>
        </div>
      </div>
    </div>

    <!-- Image dimensions -->
    <div class="section">
      <div>
        <span class="label">Output Size (px)</span>
        <div class="pair">
          <div class="field">
            <span class="sublabel">Width</span>
            <input type="number" id="img-width"  value="800"  min="1" max="16384" step="1" />
          </div>
          <div class="field">
            <span class="sublabel">Height</span>
            <input type="number" id="img-height" value="600"  min="1" max="16384" step="1" />
          </div>
        </div>
      </div>
    </div>

    <!-- Iteration & bailout -->
    <div class="section">
      <div>
        <span class="label">Max Iterations</span>
        <div class="iter-row">
          <input type="range"  id="max-iter-slider" min="16" max="5000" value="256" step="8" />
          <input type="number" id="max-iter-number" value="256" min="1" max="10000" step="1" />
        </div>
      </div>

      <div>
        <span class="label">Bailout Radius</span>
        <input type="number" id="bailout" value="2.0" min="2" max="100000" step="0.5" />
      </div>
    </div>

    <!-- Viewport -->
    <div class="section">
      <div class="slider-wrap">
        <div class="slider-head">
          <span class="label" style="margin:0">Zoom</span>
          <span class="badge" id="zoom-display">1.00×</span>
        </div>
        <input type="range" id="zoom-slider" min="-50" max="150" value="0" step="1" />
      </div>

      <div>
        <span class="label">Center (complex plane)</span>
        <div class="pair">
          <div class="field">
            <span class="sublabel">Re</span>
            <input type="number" id="center-re" value="-0.75" step="0.01" />
          </div>
          <div class="field">
            <span class="sublabel">Im</span>
            <input type="number" id="center-im" value="0"     step="0.01" />
          </div>
        </div>
      </div>
    </div>

    <!-- Color -->
    <div class="section">
      <div>
        <span class="label">Base Color</span>
        <div class="color-wrap">
          <input type="color" id="color-picker" value="#2060ff" />
          <span id="color-hex">#2060ff</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="section">
      <div class="btn-group">
        <button class="btn btn-primary"   id="generate-btn">Generate</button>
        <button class="btn btn-secondary" id="download-btn" disabled>Download PNG</button>
        <button class="btn btn-danger"    id="cancel-btn"   hidden>Cancel</button>
      </div>
    </div>

  </aside>

  <!-- ── Canvas area ── -->
  <section id="canvas-area">

    <div id="canvas-scroll">
      <canvas id="fractal-canvas" hidden></canvas>

      <div id="canvas-placeholder">
        <!-- Simple fractal icon -->
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="28" stroke="#c9d1d9" stroke-width="2"/>
          <circle cx="18" cy="32" r="10" stroke="#c9d1d9" stroke-width="1.5"/>
          <circle cx="11" cy="32" r="4"  stroke="#c9d1d9" stroke-width="1"/>
          <circle cx="46" cy="24" r="6"  stroke="#c9d1d9" stroke-width="1.5"/>
          <circle cx="46" cy="40" r="6"  stroke="#c9d1d9" stroke-width="1.5"/>
        </svg>
        <span>Configure parameters and click <strong>Generate</strong></span>
      </div>
    </div>

    <div id="progress-wrap" hidden>
      <progress id="progress-bar" max="1" value="0"></progress>
      <span id="progress-label"></span>
    </div>

  </section>

</main>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
